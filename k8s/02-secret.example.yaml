apiVersion: v1
kind: Secret
metadata:
  name: naco-secret
  namespace: naco
type: Opaque
stringData:
  # Remplacer par le vrai token TMDB avant kubectl apply.
  TMDB_TOKEN: "your_tmdb_read_access_token_here"

  # Mot de passe PostgreSQL utilisé par le conteneur postgres.
  POSTGRES_PASSWORD: "naco_password"

  # URL SQLAlchemy utilisée par FastAPI.
  # Le hostname correspond au Service Kubernetes défini dans postgres-service.yaml.
  DATABASE_URL: "postgresql://naco_user:naco_password@naco-postgres:5432/naco"

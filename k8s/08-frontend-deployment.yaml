apiVersion: apps/v1
kind: Deployment
metadata:
  name: naco-frontend
  namespace: naco
  labels:
    app: naco-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: naco-frontend
  template:
    metadata:
      labels:
        app: naco-frontend
    spec:
      containers:
        - name: frontend
          image: naco-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

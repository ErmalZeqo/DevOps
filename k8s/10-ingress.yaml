apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: naco-api-ingress
  namespace: naco
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: naco.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: naco-backend
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: naco-frontend-ingress
  namespace: naco
spec:
  ingressClassName: nginx
  rules:
    - host: naco.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: naco-frontend
                port:
                  number: 80

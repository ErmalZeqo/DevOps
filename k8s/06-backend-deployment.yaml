apiVersion: apps/v1
kind: Deployment
metadata:
  name: naco-backend
  namespace: naco
  labels:
    app: naco-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: naco-backend
  template:
    metadata:
      labels:
        app: naco-backend
    spec:
      containers:
        - name: backend
          image: naco-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: TMDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: naco-secret
                  key: TMDB_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: naco-secret
                  key: DATABASE_URL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: naco-config
                  key: LOG_LEVEL
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
